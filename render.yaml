services:
  - type: web
    name: quizflow-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quizflow-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: PASSWORD_RESET_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: EXPOSE_PASSWORD_RESET_TOKEN
        value: "false"
      - key: RATE_LIMIT_PER_MINUTE
        value: 20
      - key: FRONTEND_URL
        value: https://quizflow-frontend.onrender.com
      - key: CORS_ORIGINS
        value: https://quizflow-frontend.onrender.com
      - key: INITIAL_ADMIN_NAME
        value: Admin User
      - key: INITIAL_ADMIN_EMAIL
        value: admin@example.com
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: INITIAL_ADMIN_SYNC_PASSWORD
        value: "false"
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        value: ""
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: ""
      - key: SMTP_USE_TLS
        value: "true"

  - type: web
    name: quizflow-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://quizflow-backend.onrender.com/api/v1

databases:
  - name: quizflow-db
    plan: free
    databaseName: quiz_db
    user: quiz_user
